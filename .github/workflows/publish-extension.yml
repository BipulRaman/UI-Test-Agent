name: Publish VS Code Extension

# Publishes the UI Test Agent extension to the Visual Studio Marketplace.
#
# Triggers
# --------
#  * Push a tag like  v0.3.1  (or  release-v0.3.1)  -> builds + publishes the version
#    declared in extension/package.json. Tag must match package.json version.
#  * Manual run via the Actions tab ("Run workflow")
#       - dry_run = true  -> only build + upload .vsix artifact (no publish)
#       - dry_run = false -> build + publish to the Marketplace
#
# Versioning policy
# -----------------
#  This workflow NEVER bumps the version in CI. Bump locally with
#       cd extension
#       npm version patch    # or minor / major
#       cd ..
#       git push --follow-tags
#  This guarantees package.json, the git tag, and the artifact filename all agree.
#
# Required repository secret
# --------------------------
#  * VSCE_PAT  -- Azure DevOps Personal Access Token with
#                 "Marketplace -> Manage" scope, scoped to
#                 "All accessible organizations".
#                 See extension/PUBLISHING.md section 1.2.

on:
  push:
    tags:
      - "v*.*.*"
      - "release-v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build .vsix only, do not publish)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Compile TypeScript
        run: npm run compile

      - name: Read extension version
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          PUBLISHER=$(node -p "require('./package.json').publisher")
          echo "version=$VERSION"     >> "$GITHUB_OUTPUT"
          echo "name=$NAME"           >> "$GITHUB_OUTPUT"
          echo "publisher=$PUBLISHER" >> "$GITHUB_OUTPUT"
          echo "Extension: $PUBLISHER.$NAME @ $VERSION"

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#release-}"   # strip optional 'release-' prefix
          TAG="${TAG#v}"                      # strip leading 'v'
          PKG="${{ steps.ver.outputs.version }}"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag version ($TAG) does not match extension/package.json version ($PKG)."
            echo "Update package.json or re-tag, then push again."
            exit 1
          fi
          echo "Tag and package.json agree on version $PKG."

      - name: Validate VSCE_PAT (fail-fast on bad credentials)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          PUBLISHER: ${{ steps.ver.outputs.publisher }}
        run: |
          if [ -z "${VSCE_PAT}" ]; then
            echo "::error::Repository secret VSCE_PAT is not set."
            echo "::error::Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          echo "Checking PAT against publisher '$PUBLISHER'..."
          if ! npx --yes @vscode/vsce verify-pat "$PUBLISHER" --pat "$VSCE_PAT"; then
            echo "::error::VSCE_PAT failed verification for publisher '$PUBLISHER' (HTTP 401)."
            echo "::error::Common causes:"
            echo "::error::  1) PAT scope is wrong. It must include 'Marketplace -> Manage'."
            echo "::error::  2) PAT 'Organization' dropdown must be 'All accessible organizations'."
            echo "::error::  3) PAT is expired (Azure DevOps PATs default to 30 days)."
            echo "::error::  4) PAT belongs to a different Microsoft account than the one that owns the publisher."
            echo "::error::  5) Publisher '$PUBLISHER' does not exist at https://marketplace.visualstudio.com/manage."
            echo "::error::See extension/PUBLISHING.md section 1 for full setup."
            exit 1
          fi
          echo "PAT is valid for publisher '$PUBLISHER'."

      - name: Package .vsix
        run: npx --yes @vscode/vsce package --out "ui-test-agent-${{ steps.ver.outputs.version }}.vsix"

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-agent-${{ steps.ver.outputs.version }}-vsix
          path: extension/ui-test-agent-${{ steps.ver.outputs.version }}.vsix
          if-no-files-found: error
          retention-days: 30

      - name: Publish to Visual Studio Marketplace
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          echo "Publishing the prebuilt .vsix as-is (no version bump in CI)."
          npx --yes @vscode/vsce publish \
            --pat "$VSCE_PAT" \
            --packagePath "ui-test-agent-${{ steps.ver.outputs.version }}.vsix"

      - name: Summary
        if: always()
        run: |
          {
            echo "### UI Test Agent — Marketplace publish"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Publisher | \`${{ steps.ver.outputs.publisher }}\` |"
            echo "| Extension | \`${{ steps.ver.outputs.name }}\` |"
            echo "| Version   | \`${{ steps.ver.outputs.version }}\` |"
            echo "| Trigger   | \`${{ github.event_name }}\` |"
            echo "| Ref       | \`${{ github.ref }}\` |"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "| Mode      | Dry run (artifact only) |"
            else
              echo "| Mode      | Published to Marketplace |"
              echo ""
              echo "View listing: <https://marketplace.visualstudio.com/items?itemName=${{ steps.ver.outputs.publisher }}.${{ steps.ver.outputs.name }}>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
